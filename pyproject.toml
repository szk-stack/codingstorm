[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codingstorm"
version = "0.1.0"
description = "按项目隔离的 AI 编码任务队列（Claude Code / Pi / CodeBuddy）：把「同步等待」变成「异步投递 + 事后审批」"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # uvicorn 需要它才能处理 WebSocket 升级请求 —— 缺了不会报错，
    # 而是对升级请求直接返回 404 并在日志里留一行 WARNING。
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Windows 没有系统 tzdata，ZoneInfo("Asia/Shanghai") 会直接抛异常
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
codingstorm = "codingstorm.app:main"
cs = "codingstorm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codingstorm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

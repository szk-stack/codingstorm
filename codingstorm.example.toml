# codingstorm 配置示例。
#
# 复制为 codingstorm.toml 后按需修改，启动时用 --config 指定：
#     codingstorm --config codingstorm.toml
#
# 不指定 --config 时全部使用下面的默认值。

# 数据根目录。执行机上的所有产物都放这里。
# 注意 /srv 需要 sudo，所以默认放在家目录下。
root = "~/codingstorm"

[server]
# 默认只监听本机。要远程访问请自己加反向代理或改这里。
host = "127.0.0.1"
port = 8788

[scheduler]
# 全局并发上限。**由内存决定** —— 每个 Claude Code 进程约 200-400MB；
# Pi 是 Node 进程，占用不同但同样不轻。执行机可用内存不大时保持 2 左右，否则会 OOM。
#
# 项目内永远是串行（硬约束），这个上限只在项目之间起作用。
max_concurrent = 2
poll_interval_s = 1.0

# 定时任务迟到多久还算「准时」。轮询是一秒一次，正常不会晚；只有平台重启或
# 停机才会迟到。宽限期内的补跑一次，超过就跳过（一次性任务标记成「已错过」
# 留在界面上，不静默消失）。**一律不补跑**，否则停机三天开机时会一口气冒三条。
misfire_grace_s = 600

# ---- 执行窗口 ----
# 只在指定时段启动任务。动机是**谷时定价**：中转服务凌晨常有大幅折扣，
# 白天提交、夜里跑便宜得多。
#
# 两个要点：
#   · 只拦「新任务的启动」，**不打断已经跑起来的** —— 中途 kill 掉的钱不会退，
#     重跑还要再花一遍。
#   · 它和「定时任务」是两件事：定时任务决定**什么时候入队**，
#     窗口决定**什么时候能开始执行**。设成「每天 9 点」的定时任务配上
#     00:30-08:30 的窗口，入队后要等到第二天凌晨才真正开跑。
[scheduler.window]
# 默认关。要用就得显式打开，不然升级完大家的任务会突然开始排队等窗口。
enabled = false
# **必须写时区**。执行机的系统时区可能是 UTC，而「凌晨」指的是你那边的凌晨。
timezone = "Asia/Shanghai"
# 支持多段；start > end 表示跨天（如 22:00-06:00）。
# 急事要立刻跑： cs window off（内存态，重启即恢复）
windows = [["00:30", "08:30"]]

# 单个项目可以不走窗口（比如任务小、不在乎成本），在界面横幅右边直接选，
# 或者命令行：
#     cs window --project <项目> always      不受窗口限制
#     cs window --project <项目> inherit     跟随全局
#     cs window --project <项目> custom --windows "09:00-18:00"

[task]
# 单个任务的轮数上限。Claude Code / CodeBuddy 走 --max-turns；Pi 没有这个开关，
# 平台自己数 turn_end 事件，在下一轮开始前拦下并杀进程组。
# 0 = 不限制轮数（CLI 不传 --max-turns，Pi 不计数）；不建议，死循环 agent 能烧一整晚。
# 复杂功能（比如给游戏加一套系统）50 轮可能不够；可以调到 100–200，
# 但要接受更高的 token 成本，并优先考虑把任务拆小。
max_turns = 50
# 墙钟上限：超过就整组 SIGTERM→SIGKILL。
# 0 = 不限制墙钟；idle_timeout 仍会拦住「没有任何输出」的卡死。
wall_clock_timeout_s = 3600
# 空闲上限：这么久没有任何输出就判定卡死。Claude Code 的 api_retry
# 退避最长到 38 秒一轮，所以别设得比它小太多。
idle_timeout_s = 300

[context]
# 任务结束后自动生成变更记录。
# **这是整套上下文机制能否活过三个月的前提** —— 靠人记得维护的文档一定会腐烂
# （Cline 的 Memory Bank 就是这么死的）。代价是每个任务多一次轻量模型调用，
# 而由于 Claude Code 的固定开销很高，这一次调用大致会让成本翻倍。
sediment = true
sediment_max_diff_bytes = 24576
# 注入 prompt 的变更记录上限。它会一直增长，全量塞进去迟早挤爆上下文。
journal_prompt_chars = 6000

# ---- Phase 8 · 严格模式 ----
# 默认全关 —— 升个版本不能让现有任务突然开始等人点头。
# 开启后，只有 `cs submit --mode strict`（或 kind 命中 strict_kinds）的任务走状态机：
# 先诊断并给出方案，停在「待决策」，等人发【进入开发】才允许改产品代码。
[agents]
enabled = false
# 哪些 kind 自动走严格模式；空 = 全靠显式 --mode strict。
# 注意 kind 本身仍只是标签，真正决定执行流程的是任务的 mode。
strict_kinds = []
# 净室评审最多几轮；超过仍有阻断问题就停下等人工。
max_review_rounds = 6

[pricing]
# 价目表。**不填的话成本留空** —— `total_cost_usd` 是按另一端价目算的，不能用。
# 参考同目录的 prices.example.toml。
# prices_file = "~/codingstorm/prices.toml"

# ---- 执行器 ----
# 用哪个 CLI 跑任务：claude / pi / codebuddy。项目可以在注册时覆盖。
[runtime]
default = "claude"

[pi]
# npm: npm install -g @earendil-works/pi-coding-agent
# 必须能在跑服务端那台机器的 PATH 里直接找到。
binary = "pi"
# 留空 = 用 Pi 自己 settings.json 里的默认模型。
# 指定时支持 `provider/id` 与 `:thinking` 后缀，例如 "deepseek/deepseek-chat:high"
# model = ""
# --provider 必须和 --model 一起用，单独写会在启动时报配置错误
# provider = ""
# thinking = "high"          # off|minimal|low|medium|high|xhigh|max
#
# 项目信任。无人值守默认 ignore：不加载仓库里的 .pi/settings.json、扩展和技能
# （它们会以 Pi 进程的权限执行任意代码）。AGENTS.md / CLAUDE.md 不受影响，仍会加载。
# approve = 信任并加载；inherit = 不传开关，交给 Pi 自己的 defaultProjectTrust。
project_trust = "ignore"
# 会话文件目录。留空 = Pi 默认位置（~/.pi/agent/sessions，按工作目录分组）。
# 多轮对话要靠它找回上一轮的会话，别在任务中途改。
# session_dir = "~/codingstorm/pi-sessions"
# 透传参数，给 Pi 升级后新增的开关用（排在平台参数之后、prompt 之前）
extra_args = []

[codebuddy]
# 腾讯云 CodeBuddy Code CLI（命令名 codebuddy 或 cbc）。
# 它的 headless 模式兼容 Claude Code：-p --output-format stream-json、
# --max-turns、--permission-mode、--resume、--settings、--add-dir 都有。
binary = "codebuddy"
# 非交互写文件/跑命令必须跳过权限确认；边界仍由下面的 guard hook 负责
permission_mode = "bypassPermissions"
# 留空用 CodeBuddy 自己的默认模型
# model = "gpt-5"
# settings_file 由程序自动接管（只含 hook，不混入 [claude.env]）
# 透传参数，给 CLI 升级后新增的开关用
extra_args = []

[claude]
binary = "claude"
# 无人值守必须全自动放行；边界靠下面的 hook 拦。
permission_mode = "bypassPermissions"
# settings_file 一般不用管 —— 启用 guard 后由程序自动接管（--settings 是合并语义）

# ---- 边界拦截 ----
# 规则对所有执行器都生效（历史原因，这些配置项仍挂在 [claude] 下）：
#   · Claude Code 走 PreToolUse hook（bypassPermissions 会绕过权限检查，
#     所以 permissions.deny 不可靠，只能靠 hook —— Phase 0 已实测）
#   · Pi 没有权限系统，走平台生成的 tool_call 扩展（同一个 guard.py 判定）
guard_enabled = true
guard_block_push = true
# 默认关：开了会连带挡掉正常的依赖安装，容易误伤
guard_block_network = false
# 追加自定义拦截规则（正则，匹配整条 Bash 命令）
guard_extra_deny = []
# 白名单，命中则不拦（优先级高于所有 deny 规则）
guard_allow = []

# ---- 直连供应商（可选）----
# 写进 --settings 的 env，**优先级高于 ~/.claude/settings.json**。
# 用来绕开 CC Switch 这类只在本地起代理的工具：任务直连供应商，不用先开代理。
# 注意：token 是明文，这个文件不要进版本库。
# [claude.env]
# ANTHROPIC_BASE_URL = "https://api.deepseek.com/anthropic"
# ANTHROPIC_AUTH_TOKEN = "sk-..."
# ANTHROPIC_MODEL = "deepseek-v4-flash"
# ANTHROPIC_DEFAULT_SONNET_MODEL = "deepseek-v4-flash"
# ANTHROPIC_DEFAULT_OPUS_MODEL = "deepseek-v4-pro"

# ---- 对话式助手 ----
# 顶栏「助手」页里那个能用自然语言提需求的聊天窗口。
#
# 它是**独立进程**（仓库外的 codingstorm-assistant 目录），主服务只负责探测和
# 按需拉起；崩了不影响任务队列，重启任务队列也不会打断正在写的那轮对话。
# 助手的工具白名单只有四个：list_projects / create_task / get_project_context /
# list_tasks —— 它能建任务，但不能改代码、不碰 shell，也不等待任务执行。
[assistant]
enabled = true
# 助手首页。iframe 直接嵌它，任务链接也用它拼。
url = "http://127.0.0.1:8001"
# 让主服务在启动时顺手把它拉起来。关掉就自己跑 start-assistant.bat。
autostart = false
# 助手代码所在目录（里面要有 server.py）。
# dir = "D:/project/codingstorm-assistant"
# 留空 = 用当前解释器跑（助手只用标准库，不用另装依赖）
# python = ""
# 留空 = 复用 [claude.env] 的 ANTHROPIC_AUTH_TOKEN（同一家供应商时省事）。
# 注意：明文密钥，这个文件不要进版本库。
# api_key = "sk-..."
# 留空 = 用助手自己 config.py 里的 MODEL
# model = ""


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codingstorm"
version = "0.1.0"
description = "按项目隔离的 Claude Code 任务队列：把「同步等待」变成「异步投递 + 事后审批」"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
codingstorm = "codingstorm.app:main"

[tool.hatch.build.targets.wheel]
packages = ["codingstorm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
